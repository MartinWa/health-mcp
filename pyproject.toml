[project]
name = "health-mcp"
version = "0.1.0"
description = "MCP server for personal health data (Open Wearables + strong-data)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4,<5",
    "httpx>=0.27",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=7.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
exclude = ["tests", "**/node_modules", "**/__pycache__"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = [".", "src", "tests"]
testpaths = ["tests"]
markers = ["live: hits the live upstream APIs (skipped without credentials)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_mcp"]
